[package]
name = "sidefolk"
version = "0.1.0"
description = "A 3D familiar that gives your AI agents a body"
edition = "2024"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net"] }
axum = "0.8"
portable-pty = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = "0.3"
objc2-event-kit = "0.3"
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

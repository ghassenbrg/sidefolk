name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CLAUDE_CONFIG_DIR: ${{ runner.temp }}/sidefolk-claude
      CODEX_HOME: ${{ runner.temp }}/sidefolk-codex
      SIDEFOLK_DATA_DIR: ${{ runner.temp }}/sidefolk-data
      SIDEFOLK_CLAUDE_SETTINGS: ${{ runner.temp }}/sidefolk-claude/settings.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npx playwright install webkit
      - run: bash scripts/release-checks.sh

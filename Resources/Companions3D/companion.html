<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sidefolk 3D Companion</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
// A 3D companion inside Sidefolk's companion window (D51). Sidefolk keeps its own state machine,
// idle scheduler, hit testing and bubbles (on an invisible 2D rig); this page only shows the 3D
// character (`?c=mochi|spark|ember|kiko|nimbo|folio`) and plays what Sidefolk tells it, sent as
// `sidefolk.handle({...})` from Swift (Companion3DStage).
import { Companion } from './engine/engine.js';

const CHARACTERS = ['mochi', 'spark', 'ember', 'kiko', 'nimbo', 'folio'];
const post = (msg) => window.webkit?.messageHandlers?.companion?.postMessage(msg);
const OPTIONS = {
  // 30 fps while moving, 15 while it only breathes, 1.5× pixels: smooth for a small desktop
  // character at a fraction of the cost of 60. A small shadow map, redrawn every other frame.
  interactive: false, frame: 'sidefolk', liveliness: 'balanced', maxFps: 30, idleFps: 15, maxPixelRatio: 1.5, hopScale: 0.4,
  shadowSize: 512, shadowEvery: 2,
  // Sidefolk's own effects (!, ?, zZz, notes…) draw over the page: the engine adds none.
  marks: false,
};
let c = null;
let loading = Promise.resolve();

/** Shows character `id`. A swap keeps the one shown until the next has drawn its first frame,
 *  on a canvas of its own above it, then frees the old one. */
function show(id) {
  loading = loading.then(async () => {
    const character = (await import(`./characters/${CHARACTERS.includes(id) ? id : 'mochi'}.js`)).default;
    const canvas = document.createElement('canvas');
    document.body.append(canvas);
    const next = new Companion(canvas, character, OPTIONS);
    // A hidden window stays hidden: the newcomer draws its first frame and waits.
    if (c) { next.paused = c.paused; next.opts.liveliness = c.opts.liveliness; }
    await next.load();
    if (c) {
      next.setState(c.state); next.setPosture(c.posture);
      c.dispose();
    }
    c = window.companion = next;
    post({ kind: 'ready' });
  });
}

// Sidefolk's antics (CharacterAntic) and gestures (CharacterGesture) as 3D moves.
const ANTICS = {
  earTwitch: () => c.fidget('earTwitch'), blink: () => c.forceBlink(),
  stretch: 'stretch', yawn: 'yawn', scratch: 'scratch', hop: 'hop', wiggle: 'giggle', peek: 'peek',
  glance: 'lookAround', lookAround: 'lookAround', sneeze: 'sneeze', doubleTake: 'surprised',
  boop: 'boop', land: 'boop', spin: 'celebrate', dizzy: 'dizzy',
  // News (a reminder, a message) and work done get the reaction for the liveliness chosen.
  startle: () => c.react('alert'),
  cheer: () => (c.state === 'success' ? c.react('success') : c.play('cheer')),
  wave: 'wave', dance: 'dance', bow: 'bow', nod: 'nod', shake: 'shake', breathe: 'breathe',
  flick: 'hop', roll: 'cheer', pump: 'cheer',
  pet: () => stroke(),
  // Sidefolk turns every other stroke into a giggle; while petting, it is one long stroke.
  giggle: () => { if (c.pet.active) stroke(); else c.play('giggle'); },
};

/** Each stroke keeps the petting going 2.6 s more; the bliss deepens while it lasts. */
function stroke() {
  c.pet.active = true;
  clearTimeout(window.petT);
  window.petT = setTimeout(() => { c.pet.active = false; }, 2600);
}
const MOODS = { joy: 'happy', bliss: 'content', squeeze: 'giggle', drowsy: 'sleepy', wince: 'wince', curious: 'curious', surprised: 'surprised' };

window.sidefolk = {
  handle(e) {
    if (!c) return;
    switch (e.kind) {
      case 'state': c.setState(e.name); break;
      case 'posture': c.setPosture(e.name); break;
      case 'antic': case 'gesture': {
        const a = ANTICS[e.name];
        // A move this body can't do (a robot's sniff) falls back to a small hop of joy.
        if (typeof a === 'function') a(); else if (a && !c.play(a)) c.play('hop');
        break;
      }
      case 'mood': c.setMood(MOODS[e.name] || e.name); break;
      case 'speak': c.talk(e.level ?? 0); break;
      case 'gaze': e.x == null ? c.lookAt(null) : c.lookAt(e.x * 1.6, e.y * 1.4); break;
      case 'say': c.say(e.text || ''); break;
      case 'visible': c.pause(!e.on); break;
      case 'character': show(e.id); break;
      // minimal | balanced | lively, or still (Reduce Motion): how much it does on its own and
      // how big its reactions are.
      case 'liveliness': c.opts.liveliness = e.level; break;
    }
  },
};

show(new URLSearchParams(location.search).get('c'));
</script>
</body>
</html>
